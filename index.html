<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ofertas Retail Chile</title>
<style>
:root{
  --bg:#f6f7f9; --superficie:#fff; --texto:#16181d; --suave:#6b7280;
  --borde:#e5e7eb; --sombra:0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.05);
  --verde:#15803d; --badge-bg:#111827; --badge-fg:#fff; --radio:14px;
  --control:#fff;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0f1115; --superficie:#171a21; --texto:#e8eaed; --suave:#9aa1ab;
         --borde:#262a33; --sombra:none; --verde:#4ade80;
         --badge-bg:#f3f4f6; --badge-fg:#111827; --control:#1e222a; }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--texto);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.45; -webkit-font-smoothing:antialiased;
}
.contenedor{max-width:1200px;margin-inline:auto;padding-inline:16px}
header{padding:28px 0 14px}
h1{margin:0;font-size:1.6rem;letter-spacing:-.02em}
.sub{color:var(--suave);font-size:.9rem;margin-top:4px}
.controles{
  position:sticky;top:0;z-index:10;padding:12px 0;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--borde);
}
.buscador{position:relative}
.buscador input{
  width:100%;padding:11px 14px 11px 38px;font-size:1rem;color:var(--texto);
  background:var(--control);border:1px solid var(--borde);border-radius:10px;
}
.buscador svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--suave);pointer-events:none}
.buscador input:focus-visible{outline:2px solid #3b82f6;outline-offset:1px;border-color:transparent}
.fila{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:2px;flex:1 1 320px}
.chip{
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;scroll-snap-align:start;
  padding:6px 12px;border:1px solid var(--borde);background:var(--control);color:var(--texto);
  border-radius:999px;font-size:.85rem;cursor:pointer;font-family:inherit;
}
.chip img{width:14px;height:14px;border-radius:3px}
.chip .n{color:var(--suave);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--texto);color:var(--bg);border-color:var(--texto)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.chip:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
select{
  padding:7px 10px;border-radius:9px;border:1px solid var(--borde);
  background:var(--control);color:var(--texto);font-size:.85rem;font-family:inherit;max-width:100%;
}
main{padding:18px 0 40px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
@media (max-width:400px){#grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}}
.tarjeta{
  display:flex;flex-direction:column;background:var(--superficie);
  border:1px solid var(--borde);border-top:3px solid var(--acento);
  border-radius:var(--radio);overflow:hidden;box-shadow:var(--sombra);
}
/* Imprescindible: el `display:flex` de arriba le gana al [hidden]{display:none}
   del navegador, así que sin esta regla filtrar no ocultaría nada. */
.tarjeta[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){
  .tarjeta{transition:transform .14s ease,box-shadow .14s ease}
  .tarjeta:hover{transform:translateY(-2px);box-shadow:0 2px 6px rgba(0,0,0,.06),0 10px 24px rgba(0,0,0,.09)}
}
.foto{position:relative;display:block;background:#fff;aspect-ratio:1/1}
.foto img{width:100%;height:100%;object-fit:contain;display:block}
.badge{
  position:absolute;top:8px;left:8px;background:var(--badge-bg);color:var(--badge-fg);
  font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:999px;font-variant-numeric:tabular-nums;
}
.cuerpo{padding:12px 13px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
.tienda{display:flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;color:var(--acento)}
.tienda img{width:13px;height:13px;border-radius:3px}
.marca{font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;color:var(--suave)}
.nombre{
  margin:0;font-size:.9rem;font-weight:500;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.precios{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:3px}
.final{font-size:1.32rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.normal{color:var(--suave);font-size:.85rem;font-variant-numeric:tabular-nums}
.ahorro{color:var(--verde);font-size:.78rem;font-weight:600}
.tarjeta-precio{font-size:.76rem;color:var(--suave);font-variant-numeric:tabular-nums}
.hist{margin-top:3px;color:var(--suave);font-size:.7rem;display:flex;align-items:center;gap:6px}
.hist svg{width:52px;height:16px;flex:none;opacity:.65}
.cta{
  margin-top:auto;padding-top:9px;font-size:.82rem;font-weight:600;
  color:var(--acento);text-decoration:none;
}
.cta:hover{text-decoration:underline}
a.foto:focus-visible,.cta:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
#vacio{text-align:center;color:var(--suave);padding:56px 16px}
#vacio button{
  margin-top:10px;padding:8px 16px;border-radius:9px;border:1px solid var(--borde);
  background:var(--control);color:var(--texto);cursor:pointer;font-family:inherit;font-size:.85rem;
}
footer{border-top:1px solid var(--borde);padding:20px 0 34px;color:var(--suave);font-size:.75rem}
footer p{margin:3px 0}
</style>
</head>
<body>

<div class="contenedor">
  <header>
    <h1>Ofertas Retail Chile</h1>
    <p class="sub" id="resumen"></p>
  </header>
</div>

<div class="controles">
  <div class="contenedor">
    <div class="buscador">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
      </svg>
      <input id="q" type="search" placeholder="Buscar producto o marca…" autocomplete="off" aria-label="Buscar">
    </div>
    <div class="fila">
      <div class="chips" id="chips" role="group" aria-label="Filtrar por tienda"></div>
      <select id="cat" aria-label="Categoría"></select>
      <select id="orden" aria-label="Ordenar">
        <option value="desc">Mayor descuento</option>
        <option value="precio-asc">Menor precio</option>
        <option value="precio-desc">Mayor precio</option>
        <option value="ahorro">Mayor ahorro</option>
      </select>
    </div>
  </div>
</div>

<main class="contenedor">
  <div id="grid"></div>
  <div id="vacio" hidden>
    <p>Sin resultados con esos filtros.</p>
    <button type="button" id="limpiar">Limpiar filtros</button>
  </div>
</main>

<div class="contenedor">
  <footer>
    <p>Ofertas al 4 de septiembre, 21:05 · Se revisan las tiendas cada 15 minutos.</p>
    <p>Proyecto personal, sin fines comerciales. Los precios e imágenes pertenecen a cada tienda
       y pueden cambiar sin aviso; cada tarjeta enlaza a la ficha original.</p>
    <p>2026</p>
  </footer>
</div>

<script>
(function(){
"use strict";
var OFERTAS = JSON.parse(document.getElementById("datos").textContent);
var TIENDAS = JSON.parse(document.getElementById("tiendas").textContent);

var grid = document.getElementById("grid");
var vacio = document.getElementById("vacio");
var inputQ = document.getElementById("q");
var selCat = document.getElementById("cat");
var selOrden = document.getElementById("orden");
var contChips = document.getElementById("chips");

// Normaliza para buscar sin acentos ni mayúsculas. Se aplica al dato Y a la
// consulta, para que "computacion" encuentre "Computación" y viceversa.
function norm(s){
  return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}
function miles(n){
  return (n == null) ? "" : n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}
function fmt(n, formato){
  return formato === "millas" ? miles(n) + " millas" : "$" + miles(n);
}
var PLACEHOLDER = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
  '<rect width="100" height="100" fill="#f1f2f4"/>' +
  '<path d="M28 62l14-16 10 11 8-8 12 13z" fill="#cbd0d8"/>' +
  '<circle cx="38" cy="38" r="6" fill="#cbd0d8"/></svg>');

function seguro(url){ return /^https?:\/\//i.test(url || "") ? url : ""; }

function sparkline(puntos){
  var ns = "http://www.w3.org/2000/svg";
  var vals = puntos.map(function(p){ return p[1]; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var rango = (max - min) || 1;
  var pts = vals.map(function(v, i){
    var x = (i / (vals.length - 1)) * 100;
    var y = 22 - ((v - min) / rango) * 20;
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  var svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 100 24");
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("aria-hidden", "true");
  var linea = document.createElementNS(ns, "polyline");
  linea.setAttribute("points", pts);
  linea.setAttribute("fill", "none");
  linea.setAttribute("stroke", "currentColor");
  linea.setAttribute("stroke-width", "1.5");
  linea.setAttribute("vector-effect", "non-scaling-stroke");
  linea.setAttribute("stroke-linejoin", "round");
  svg.appendChild(linea);
  return svg;
}

// Se construyen TODAS las tarjetas una vez. Al filtrar solo se togglea `hidden` y
// al ordenar se re-appendea el nodo: recrearlas recargaría los <img loading=lazy>
// y produciría parpadeo en cada tecla.
function crearTarjeta(o){
  var estilo = TIENDAS[o.tienda] || {nombre:o.tienda, color:"#3498DB", fav:"", tarjeta:"Tarjeta"};
  var art = document.createElement("article");
  art.className = "tarjeta";
  art.style.setProperty("--acento", estilo.color);

  var enlace = seguro(o.url);
  var foto = document.createElement(enlace ? "a" : "div");
  foto.className = "foto";
  if (enlace){
    foto.setAttribute("href", enlace);
    foto.setAttribute("target", "_blank");
    foto.setAttribute("rel", "noopener noreferrer");
    foto.setAttribute("aria-label", o.nombre);
  }
  if (o.descuento > 0){
    var badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = "-" + o.descuento + "%";
    foto.appendChild(badge);
  }
  var img = document.createElement("img");
  img.setAttribute("src", seguro(o.imagen) || PLACEHOLDER);
  img.setAttribute("alt", "");
  img.setAttribute("loading", "lazy");
  img.setAttribute("decoding", "async");
  img.setAttribute("referrerpolicy", "no-referrer");
  img.addEventListener("error", function(){ img.setAttribute("src", PLACEHOLDER); });
  foto.appendChild(img);
  art.appendChild(foto);

  var cuerpo = document.createElement("div");
  cuerpo.className = "cuerpo";

  var tienda = document.createElement("div");
  tienda.className = "tienda";
  if (estilo.fav){
    var fav = document.createElement("img");
    fav.setAttribute("src", estilo.fav);
    fav.setAttribute("alt", "");
    fav.setAttribute("loading", "lazy");
    tienda.appendChild(fav);
  }
  var nomTienda = document.createElement("span");
  nomTienda.textContent = estilo.nombre;
  tienda.appendChild(nomTienda);
  cuerpo.appendChild(tienda);

  if (o.marca){
    var marca = document.createElement("div");
    marca.className = "marca";
    marca.textContent = o.marca;
    cuerpo.appendChild(marca);
  }

  var nombre = document.createElement("h2");
  nombre.className = "nombre";
  nombre.textContent = o.nombre;
  nombre.setAttribute("title", o.nombre);
  cuerpo.appendChild(nombre);

  var precios = document.createElement("div");
  precios.className = "precios";
  var final = document.createElement("span");
  final.className = "final";
  final.textContent = fmt(o.precio_final, o.formato);
  precios.appendChild(final);
  if (o.precio_original && o.precio_original > o.precio_final){
    var normal = document.createElement("s");
    normal.className = "normal";
    normal.textContent = fmt(o.precio_original, o.formato);
    precios.appendChild(normal);
  }
  cuerpo.appendChild(precios);

  if (o.ahorro){
    var ahorro = document.createElement("div");
    ahorro.className = "ahorro";
    ahorro.textContent = "Ahorras " + fmt(o.ahorro, o.formato);
    cuerpo.appendChild(ahorro);
  }
  if (o.precio_tarjeta){
    var tp = document.createElement("div");
    tp.className = "tarjeta-precio";
    tp.textContent = "💳 " + estilo.tarjeta + " " + fmt(o.precio_tarjeta, o.formato);
    cuerpo.appendChild(tp);
  }
  if (o.historial && o.historial.length > 1){
    var hist = document.createElement("div");
    hist.className = "hist";
    hist.appendChild(sparkline(o.historial));
    var cap = document.createElement("span");
    cap.textContent = fmt(o.historial[0][1], o.formato) + " → " +
                      fmt(o.historial[o.historial.length - 1][1], o.formato);
    hist.appendChild(cap);
    cuerpo.appendChild(hist);
  }
  if (enlace){
    var cta = document.createElement("a");
    cta.className = "cta";
    cta.setAttribute("href", enlace);
    cta.setAttribute("target", "_blank");
    cta.setAttribute("rel", "noopener noreferrer");
    cta.textContent = "Ver en " + estilo.nombre + " →";
    cuerpo.appendChild(cta);
  }
  art.appendChild(cuerpo);
  return art;
}

OFERTAS.forEach(function(o){
  o._busca = norm(o.nombre + " " + (o.marca || ""));
  o._nodo = crearTarjeta(o);
  grid.appendChild(o._nodo);
});

// ---- filtros ----
var seleccion = new Set();

function categorias(){
  var set = {};
  OFERTAS.forEach(function(o){ set[o.categoria] = true; });
  return Object.keys(set).sort(function(a, b){ return a.localeCompare(b, "es"); });
}

function coincide(o, q, cat){
  if (cat && o.categoria !== cat) return false;
  if (seleccion.size && !seleccion.has(o.tienda)) return false;
  if (q.length){
    for (var i = 0; i < q.length; i++){
      if (o._busca.indexOf(q[i]) === -1) return false;
    }
  }
  return true;
}

function aplicar(){
  var q = norm(inputQ.value).split(/\s+/).filter(Boolean);
  var cat = selCat.value;
  var visibles = [];
  OFERTAS.forEach(function(o){
    var ok = coincide(o, q, cat);
    o._nodo.hidden = !ok;
    if (ok) visibles.push(o);
  });

  var orden = selOrden.value;
  visibles.sort(function(a, b){
    if (orden === "precio-asc")  return a.precio_final - b.precio_final;
    if (orden === "precio-desc") return b.precio_final - a.precio_final;
    if (orden === "ahorro")      return (b.ahorro || 0) - (a.ahorro || 0);
    return b.descuento - a.descuento;
  });
  // appendChild MUEVE el nodo existente: no recarga la imagen.
  var frag = document.createDocumentFragment();
  visibles.forEach(function(o){ frag.appendChild(o._nodo); });
  grid.appendChild(frag);

  vacio.hidden = visibles.length > 0;
  resumen.textContent = visibles.length + " " +
    (visibles.length === 1 ? "oferta vigente" : "ofertas vigentes") +
    " · " + Object.keys(TIENDAS).length + " tiendas · al 4 de septiembre, 21:05";

  // Conteo por tienda ignorando el propio filtro de tienda (faceted search).
  var conteo = {};
  OFERTAS.forEach(function(o){
    if (cat && o.categoria !== cat) return;
    if (q.length){
      for (var i = 0; i < q.length; i++){ if (o._busca.indexOf(q[i]) === -1) return; }
    }
    conteo[o.tienda] = (conteo[o.tienda] || 0) + 1;
  });
  var total = 0;
  Object.keys(conteo).forEach(function(t){ total += conteo[t]; });
  contChips.querySelectorAll(".chip").forEach(function(chip){
    var t = chip.dataset.tienda;
    var n = t ? (conteo[t] || 0) : total;
    chip.querySelector(".n").textContent = n;
  });
  guardarHash(cat, orden);
}

function guardarHash(cat, orden){
  var partes = [];
  if (inputQ.value.trim()) partes.push("q=" + encodeURIComponent(inputQ.value.trim()));
  if (seleccion.size) partes.push("t=" + Array.from(seleccion).join(","));
  if (cat) partes.push("c=" + encodeURIComponent(cat));
  if (orden !== "desc") partes.push("o=" + orden);
  var hash = partes.length ? "#" + partes.join("&") : " ";
  history.replaceState(null, "", hash === " " ? location.pathname + location.search : hash);
}

function leerHash(){
  var h = location.hash.replace(/^#/, "");
  if (!h) return;
  h.split("&").forEach(function(par){
    var i = par.indexOf("=");
    if (i < 0) return;
    var k = par.slice(0, i), v = decodeURIComponent(par.slice(i + 1));
    if (k === "q") inputQ.value = v;
    else if (k === "t") v.split(",").filter(Boolean).forEach(function(t){ seleccion.add(t); });
    else if (k === "c") selCat.value = v;
    else if (k === "o") selOrden.value = v;
  });
}

// chips de tienda
(function construirChips(){
  function chip(tienda, etiqueta, fav){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.setAttribute("aria-pressed", "false");
    if (tienda) b.dataset.tienda = tienda;
    if (fav){
      var i = document.createElement("img");
      i.setAttribute("src", fav); i.setAttribute("alt", ""); i.setAttribute("loading", "lazy");
      b.appendChild(i);
    }
    var s = document.createElement("span");
    s.textContent = etiqueta;
    b.appendChild(s);
    var n = document.createElement("span");
    n.className = "n";
    b.appendChild(n);
    b.addEventListener("click", function(){
      if (!tienda){ seleccion.clear(); }
      else if (seleccion.has(tienda)) seleccion.delete(tienda);
      else seleccion.add(tienda);
      sincronizarChips();
      aplicar();
    });
    return b;
  }
  contChips.appendChild(chip(null, "Todas", ""));
  Object.keys(TIENDAS).sort(function(a, b){
    return TIENDAS[a].nombre.localeCompare(TIENDAS[b].nombre, "es");
  }).forEach(function(t){
    contChips.appendChild(chip(t, TIENDAS[t].nombre, TIENDAS[t].fav));
  });
})();

function sincronizarChips(){
  contChips.querySelectorAll(".chip").forEach(function(chip){
    var t = chip.dataset.tienda;
    var activo = t ? seleccion.has(t) : seleccion.size === 0;
    chip.setAttribute("aria-pressed", activo ? "true" : "false");
  });
}

// categorías
(function(){
  var opt = document.createElement("option");
  opt.value = ""; opt.textContent = "Todas las categorías";
  selCat.appendChild(opt);
  categorias().forEach(function(c){
    var o = document.createElement("option");
    o.value = c; o.textContent = c;
    selCat.appendChild(o);
  });
})();

leerHash();
sincronizarChips();

// Debounce con setTimeout y no con requestAnimationFrame: rAF se congela cuando la
// pestaña no está visible, lo que dejaría el filtro sin aplicar.
var pendiente = null;
function programar(){
  clearTimeout(pendiente);
  pendiente = setTimeout(aplicar, 80);
}
inputQ.addEventListener("input", programar);
selCat.addEventListener("change", aplicar);
selOrden.addEventListener("change", aplicar);
document.getElementById("limpiar").addEventListener("click", function(){
  inputQ.value = ""; selCat.value = ""; seleccion.clear();
  sincronizarChips(); aplicar(); inputQ.focus();
});

aplicar();
})();
</script>
